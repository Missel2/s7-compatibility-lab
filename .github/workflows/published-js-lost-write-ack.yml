name: Published JavaScript applied-write / lost-ACK replay oracle (NOT qualification)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-js-ack-loss:
    name: Real JS 4.4.1 WRITE_VAR ACK loss with independent DB1 witness
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned, hash-required disposable S7Comm fixture and independent witness
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements/python-snap7.txt
      - name: Validate source-only replay assessor and adversarial negative controls
        run: |
          python -m py_compile scripts/s7_readonly_real8_witness.py
          node --check test/candidates/published-js-lost-write-ack.cjs
          node --check scripts/assess-published-js-lost-write-ack.cjs
          node --test test/published-js-lost-ack-assessor.test.cjs
      - name: Install real unmodified published Node-RED JS and Rust control packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .candidate-consumer
          printf '%s\n' '{"name":"disposable-published-js-ack-loss","version":"0.0.0","private":true}' > .candidate-consumer/package.json
          npm install --prefix .candidate-consumer --ignore-scripts --no-audit --no-fund --save-exact \
            node-red@5.0.9 node-red-node-test-helper@0.3.6 \
            @oriolrius/node-red-contrib-s7@4.4.1 node-red-contrib-s7-rust@1.4.0
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const b=fs.readFileSync('.candidate-consumer/package-lock.json'),p=JSON.parse(b).packages;
          for(const [name,v] of Object.entries({
            'node-red':'5.0.9','node-red-node-test-helper':'0.3.6',
            '@oriolrius/node-red-contrib-s7':'4.4.1','@oriolrius/nodes7':'1.1.5',
            'node-red-contrib-s7-rust':'1.4.0'
          })){
            const d=p['node_modules/'+name];
            if(d?.version!==v||!d.integrity?.startsWith('sha512-')||
               !d.resolved?.startsWith('https://registry.npmjs.org/'))
              throw Error('Missing published candidate/runtime SRI '+name);
            console.log('ACK_LOSS_TEST_PACKAGE='+name+'@'+v+' '+d.integrity);
          }
          console.log('ACK_LOSS_TEST_NPM_LOCK_SHA256='+crypto.createHash('sha256').update(b).digest('hex'));
          NODE
      - name: Positive control healthy real JS/Rust DB1 read and teardown before fault
        run: node test/candidates/common-node-red-s7-read.cjs .candidate-consumer
        timeout-minutes: 5
      - name: Strict original JS ACK-loss candidate and independent external DB1 oracle
        run: node scripts/assess-published-js-lost-write-ack.cjs
        timeout-minutes: 5
      - name: Retain strict original candidate exit, wire evidence and independent witness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-JS-4.4.1-lost-write-ACK-NOT-QUALIFIED
          path: test-reports/*.json
          if-no-files-found: warn
          retention-days: 14
