name: Published JavaScript malformed READ_VAR characterization (NOT qualification)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-js-read-characterization:
    name: Published JS 4.4.1 real loopback malformed-READ evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install exact hashed disposable Python server
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements/python-snap7.txt
      - name: Validate independent assessor negative controls and source syntax
        run: |
          node --check test/candidates/published-js-malformed-read.cjs
          node --check scripts/assess-published-js-read.cjs
          node --test test/published-js-read-assessor.test.cjs
      - name: Install exact published Node-RED + JS and Rust controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .candidate-consumer
          printf '%s\n' '{"name":"disposable-js-malformed-read-comparison","version":"0.0.0","private":true}' > .candidate-consumer/package.json
          npm install --prefix .candidate-consumer --ignore-scripts --no-audit --no-fund --save-exact \
            node-red@5.0.9 node-red-node-test-helper@0.3.6 \
            @oriolrius/node-red-contrib-s7@4.4.1 node-red-contrib-s7-rust@1.4.0
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const bytes=fs.readFileSync('.candidate-consumer/package-lock.json');
          const lock=JSON.parse(bytes);
          for(const [name,version] of Object.entries({
            'node-red':'5.0.9','node-red-node-test-helper':'0.3.6',
            '@oriolrius/node-red-contrib-s7':'4.4.1','node-red-contrib-s7-rust':'1.4.0'
          })){
            const p=lock.packages['node_modules/'+name];
            if(!p||p.version!==version||!p.integrity||
               !p.resolved?.startsWith('https://registry.npmjs.org/'))
              throw Error('Missing immutable registry identity '+name);
            console.log('PUBLISHED_PACKAGE='+name+'@'+version+' '+p.integrity);
          }
          const dep=lock.packages['node_modules/@oriolrius/nodes7'];
          if(!dep||!dep.integrity)throw Error('Missing JS transport SRI');
          console.log('JS_TRANSPORT_PUBLISHED='+dep.version+' '+dep.integrity);
          console.log('CONSUMER_LOCK_SHA256='+crypto.createHash('sha256').update(bytes).digest('hex'));
          NODE
      - name: Verify genuine healthy-path Node-RED candidate before fault injection
        run: node test/candidates/common-node-red-s7-read.cjs .candidate-consumer
        timeout-minutes: 6
      - name: Run real JavaScript malformed READ_VAR candidates and verify exact original exits
        run: node scripts/assess-published-js-read.cjs
        timeout-minutes: 9
      - name: Archive unmodified real candidate reports (PASS or KNOWN_UNSAFE)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-js-4.4.1-malformed-read-NOT-QUALIFIED
          path: test-reports/*.json
          if-no-files-found: warn
          retention-days: 14
