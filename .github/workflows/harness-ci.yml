name: S7 lab harness self-validation (loopback only)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  self-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements/python-snap7.txt
      - run: node --test test/*.test.cjs
