name: S7 lab harness self-validation (loopback only)

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s7-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-validation:
    name: Harness unit and real S7Comm loopback (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install exact published fixture dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements/python-snap7.txt
      - name: Static syntax and provenance checks
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          test -f docs/PROVENANCE.md
          node --check lib/wire-peer.cjs
          node --check test/fixture-loopback.test.cjs
          node --check test/wire-peer-header.test.cjs
          python -m py_compile fixtures/s7_server.py scripts/s7_probe.py
      - name: Real protocol fixture and proxy positive/negative controls
        run: node --test test/*.test.cjs
        timeout-minutes: 5
      - name: Retain software-only harness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s7-harness-loopback-evidence
          path: test-reports/*.json
          if-no-files-found: warn
          retention-days: 14
