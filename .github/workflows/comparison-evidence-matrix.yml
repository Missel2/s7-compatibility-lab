name: Version-pinned S7 implementation evidence comparison (index only)
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  comparable-evidence:
    name: Reject unearned PASS and publish scoped cross-engine matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Check syntax and exercise adversarial evidence-index assertions
        run: |
          node --check scripts/build-comparison-matrix.cjs
          node --check scripts/validate-candidate-capabilities.cjs
          node --test test/comparison-matrix.test.cjs test/candidate-capabilities.test.cjs
      - name: Render machine-readable and Markdown candidate comparison
        run: |
          node scripts/build-comparison-matrix.cjs
          node scripts/validate-candidate-capabilities.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('test-reports/comparison-matrix.v1.json'));
          if(m.fullCandidateQualification!==false||m.globalRanking!==null||
             m.candidateCount!==4||m.observationCount<14||
             m.comparableScenarios.length<3)
            throw Error('Invalid independent comparison and evidence scope');
          console.log('SCOPED_EVIDENCE_MATRIX_VALID=true');
          NODE
      - name: Retain version-aware evidence index (not a live candidate run)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: S7-evidence-comparison-matrix-NOT-QUALIFIED
          path: |
            test-reports/comparison-matrix.v1.json
            test-reports/comparison-matrix.v1.md
            test-reports/candidate-capability-matrix.v1.json
          if-no-files-found: warn
          retention-days: 14
