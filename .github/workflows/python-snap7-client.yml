name: Independent released python-snap7 client against real S7Comm loopback (NOT qualification)
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  independent-python-client:
    name: Exact released Python client S7Comm DB1 READ_VAR and wire teardown
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install only pinned hashed released python-snap7
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements/python-snap7.txt
      - name: Validate read-only candidate source and adversarial assessor
        run: |
          python -m py_compile scripts/candidates/python-snap7-read.py
          node --check scripts/assess-python-snap7-client.cjs
          node --test test/python-snap7-client.test.cjs
      - name: Execute real published Python S7Comm client via independent TPKT observer
        run: node scripts/assess-python-snap7-client.cjs
        timeout-minutes: 3
      - name: Preserve raw candidate, assessor and wire hash-chain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-python-snap7-3.3.1-independent-client-NOT-QUALIFIED
          path: |
            test-reports/python-snap7-client-original.json
            test-reports/python-snap7-client-assessment.json
          if-no-files-found: warn
          retention-days: 14
