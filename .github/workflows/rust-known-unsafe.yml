name: Rust 1.4.0 known-unsafe characterization (NOT qualification)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  rust-1_4_0-known-unsafe:
    name: Rust 1.4.0 UNSAFE baseline evidence (not a release gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install exact synthetic fixture from hashed published artifact
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements/python-snap7.txt
      - name: Validate assessor negative and positive controls
        run: |
          node --check scripts/assess-rust-v1.4.0.cjs
          node --check test/candidates/rust-malformed-read.cjs
          node --check test/candidates/rust-fault-parity.cjs
          node --test test/rust-baseline-assessor.test.cjs
      - name: Install real unmodified Node-RED 5 and released native Rust v1.4.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .candidate-consumer
          printf '%s\n' '{"name":"disposable-s7-comparison-consumer","version":"0.0.0","private":true}' > .candidate-consumer/package.json
          npm install --prefix .candidate-consumer --ignore-scripts --no-audit --no-fund --save-exact \
            node-red@5.0.9 node-red-node-test-helper@0.3.6 node-red-contrib-s7-rust@1.4.0
          node - <<'NODE'
          const fs=require("node:fs"),crypto=require("node:crypto");
          const root=".candidate-consumer", lock=JSON.parse(fs.readFileSync(root+"/package-lock.json","utf8"));
          for(const spec of ["node-red","node-red-node-test-helper","node-red-contrib-s7-rust"]){
            const p=lock.packages["node_modules/"+spec];
            if(!p||!p.integrity||!p.resolved?.startsWith("https://registry.npmjs.org/"))
              throw Error("Missing published registry SRI for "+spec);
            console.log("PACKAGE_SRI "+spec+"@"+p.version+" "+p.integrity);
          }
          if(lock.packages["node_modules/node-red"].version!=="5.0.9"||
             lock.packages["node_modules/node-red-contrib-s7-rust"].version!=="1.4.0")
            throw Error("Wrong candidate package version");
          console.log("CONSUMER_LOCK_SHA256="+crypto.createHash("sha256")
            .update(fs.readFileSync(root+"/package-lock.json")).digest("hex"));
          NODE
          node -e '
            if(process.env.S7RS_NAPI) throw Error("Fake native addon via environment");
            const r=require("./.candidate-consumer/node_modules/node-red-contrib-s7-rust/lib/napi-bridge");
            if(typeof r.loadAddon().S7Native!=="function") throw Error("Real native addon missing");
            console.log("REAL_PUBLISHED_RUST_ADDON=YES");
          '
      - name: Characterize real Rust wrong-ref, lost-write-ACK and teardown failures
        run: node scripts/assess-rust-v1.4.0.cjs
        timeout-minutes: 10
      - name: Always retain candidate behavior and observer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-1.4.0-NOT-QUALIFIED-known-unsafe-reports
          path: test-reports/*.json
          if-no-files-found: warn
          retention-days: 14
